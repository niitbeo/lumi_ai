<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="1000" height="1500" style="border:1px solid black; width: 500px;"></canvas>
<script>
  const ctx = document.getElementById("c").getContext("2d");

  // Canonical Points
  const p0 = [276.0, 554.6]; // Outer
  const p1 = [415.1, 565.9]; // Inner
  const p2 = [345.9, 529.0]; // Top

  // Real Points (squinting girl, shifted)
  const f0 = [276.0, 554.6 - 20]; // Outer
  const f1 = [415.1, 565.9 - 20]; // Inner
  const f2 = [345.9, 529.0 + 10]; // Top (squinting, so Y is higher/lower? lower in canvas = higher number)

  // Draw canonical points in blue
  ctx.fillStyle = "blue";
  [p0, p1, p2].forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 7); ctx.fill(); });
  
  // Draw eyelash bounding box in canonical
  ctx.strokeStyle = "blue";
  ctx.strokeRect(260, 491, 159, 118);

  // Solve Affine
  const det = (p1[0] - p0[0]) * (p2[1] - p0[1]) - (p2[0] - p0[0]) * (p1[1] - p0[1]);
  const a = ((f1[0] - f0[0]) * (p2[1] - p0[1]) - (f2[0] - f0[0]) * (p1[1] - p0[1])) / det;
  const b = ((f2[0] - f0[0]) * (p1[0] - p0[0]) - (f1[0] - f0[0]) * (p2[0] - p0[0])) / det;
  const c = f0[0] - a * p0[0] - b * p0[1];

  const d = ((f1[1] - f0[1]) * (p2[1] - p0[1]) - (f2[1] - f0[1]) * (p1[1] - p0[1])) / det;
  const e = ((f2[1] - f0[1]) * (p1[0] - p0[0]) - (f1[1] - f0[1]) * (p2[0] - p0[0])) / det;
  const f = f0[1] - d * p0[0] - e * p0[1];

  console.log({a, b, c, d, e, f});

  // Transform and draw real in red
  ctx.setTransform(a, d, b, e, c, f);
  
  ctx.fillStyle = "red";
  [p0, p1, p2].forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 7); ctx.fill(); });
  
  ctx.strokeStyle = "red";
  ctx.strokeRect(260, 491, 159, 118);

</script>
</body>
</html>
